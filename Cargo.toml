[package]
name = "armada-fleet-print"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.39"
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
regex = "1.13.1"
reqwest = "0.13.5"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# How `cargo deploy` builds and starts this app. Server-specific values (host,
# URL, paths, container) come from the DEPLOY_* environment variables only — see
# the cargo-deploy README. Every key is optional; the commented values are the defaults.
[package.metadata.deploy]
description = "armada-fleet-print (impression de flottes Star Wars: Armada)"
# Sub-path nginx serves the app under.
url-prefix = "/armada"
# The socket path is passed to the app as <PREFIX>_SOCKET, its persistent data
# directory ($REMOTE_DIR/data, shared by all releases) as <PREFIX>_DATA_DIR.
env-prefix = "AFP"
# Arguments after the binary in ExecStart.
# args = ["serve"]
# `cargo deploy setup` creates a random secret_key.txt in the data directory if
# there is none (--new-secret-key replaces it).
# secret-key = false
# Extra service environment; NO_COLOR=1 is always set.
# env = { RUST_LOG = "info" }
# A print fetches the fleet page and every card image not cached yet.
proxy-read-timeout = "120s"
# Probed after each restart: must answer quickly, without network access.
# health-path = "/"
# Outgoing connections (API, remote database, SMTP...): off by default, the app
# then only has its Unix socket.
network = true
# Extra [Service] directives, after the built-in sandbox, e.g. to relax it.
# unit-extra = ["MemoryDenyWriteExecute=no", "MemoryMax=512M"]
# build-target = "x86_64-unknown-linux-gnu"
# keep-releases = 3
