[package]
name = "armada-fleet-print"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.39"
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
regex = "1.13.1"
reqwest = "0.13.5"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
