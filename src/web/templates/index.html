{% extends "base.html" %}

{% block content %}
{% include "lang_switch.html" %}
    <h1>{{ page.heading }}</h1>

    <div class="alert alert-danger">{{ t.account_warning|safe }}</div>

    <ul>
      {% for step in t.steps %}
      <li>{{ step|safe }}</li>
      {% endfor %}
    </ul>

    <form action="print" method="post">
      <div class="form-group">
        <input class="form-control" type="text" name="url" placeholder="{{ page.fleet_url_placeholder }}" required>
      </div>
      <button class="btn btn-primary mr-3" type="submit">{{ t.submit }}</button>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="orientation" id="orientation-portrait" value="portrait"{% if !landscape %} checked{% endif %}>
        <label class="form-check-label" for="orientation-portrait">{{ t.portrait }}</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="orientation" id="orientation-landscape" value="landscape"{% if landscape %} checked{% endif %}>
        <label class="form-check-label" for="orientation-landscape">{{ t.landscape }}</label>
      </div>
    </form>

    <h2 class="mt-5">{{ t.games_heading }}</h2>
    <p>{{ t.games_intro }}</p>
    <form action="games" method="post">
      <div class="form-group">
        <input class="form-control" type="text" name="name" placeholder="{{ t.game_name_placeholder }}" maxlength="100" required>
      </div>
      <button class="btn btn-primary" type="submit">{{ t.create_game }}</button>
    </form>
{% endblock %}
